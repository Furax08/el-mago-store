<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧙‍♂️ El Mago Stores - Panel Maestro</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 10px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: none; width: 100%; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; background: #333; color: white; }
        .nav-btn { background: #444; margin: 2px; width: auto; display: inline-block; padding: 8px 12px; }
        .btn-add { background: #00e676; color: #000; }
        .btn-copy { background: #ff9800; color: #000; }
        .btn-edit { background: #2196f3; color: white; width: auto; padding: 5px 10px; }
        .btn-del { background: #ff5252; color: white; width: auto; padding: 5px 10px; }
        .producto-row { display: flex; flex-direction: column; border-bottom: 1px solid #333; padding: 10px 0; gap: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>🧙‍♂️ El Mago Stores</h3>
        <input type="number" id="tasa" placeholder="Tasa (Bs.)" oninput="guardarYActualizar()">
        <input type="text" id="busqueda" placeholder="🔍 Buscar..." oninput="renderizar()">
        <div id="navRapida"></div>
    </div>

    <div class="card">
        <input type="text" id="nuevoJuego" placeholder="Nombre del juego...">
        <button class="btn-add" onclick="agregarJuego()">+ Agregar Juego</button>
    </div>

    <div id="contenedorJuegos"></div>

    <script>
        let datos = JSON.parse(localStorage.getItem('magoStore')) || [];
        let tasa = parseFloat(localStorage.getItem('tasaMago')) || 0;
        let firma = localStorage.getItem('firmaMago') || "🧙‍♂️EL Mago Stores - Servicio de compra - Juegos";

        document.getElementById('tasa').value = tasa;

        function guardarYActualizar() {
            tasa = parseFloat(document.getElementById('tasa').value) || 0;
            localStorage.setItem('tasaMago', tasa);
            renderizar();
        }

        function renderizar() {
            let filtro = document.getElementById('busqueda').value.toLowerCase();
            let container = document.getElementById('contenedorJuegos');
            let nav = document.getElementById('navRapida');
            container.innerHTML = '';
            nav.innerHTML = '';
            
            datos.forEach((juego, i) => {
                nav.innerHTML += `<a href="#juego_${i}"><button class="nav-btn">${juego.nombre}</button></a>`;
                if(!juego.nombre.toLowerCase().includes(filtro)) return;

                let html = `<div class="card" id="juego_${i}">
                    <h3>${juego.nombre}
                        <button class="btn-edit" onclick="mover(${i}, -1)">⬆️</button>
                        <button class="btn-edit" onclick="mover(${i}, 1)">⬇️</button>
                        <button class="btn-del" onclick="datos.splice(${i},1); actualizarStorage(); renderizar()">X</button>
                    </h3>
                    <button class="btn-add" onclick="agregarProducto(${i})">+ Prod</button>
                    <button class="btn-add" style="background:#9c27b0" onclick="agregarProducto(${i}, true)">+ Otro</button>
                    <button class="btn-copy" onclick="copiarLista(${i})">📋 Copiar Lista</button>`;
                
                juego.productos.forEach((p, pIdx) => {
                    let precioNumerico = parseFloat(p.precio) || 0;
                    let bs = (precioNumerico * tasa).toLocaleString('es-VE', {minimumFractionDigits: 2});
                    html += `<div class="producto-row">
                        <span>${p.esOtro ? '🏷️ ' : ''}${p.prod} -> <b>${bs} Bs.</b></span>
                        <div class="actions"><button class="btn-edit" onclick="editarProducto(${i}, ${pIdx})">Editar</button></div>
                    </div>`;
                });
                container.innerHTML += html + `</div>`;
            });
        }

        function mover(i, dir) {
            let nuevoIdx = i + dir;
            if(nuevoIdx >= 0 && nuevoIdx < datos.length) {
                let temp = datos[i];
                datos[i] = datos[nuevoIdx];
                datos[nuevoIdx] = temp;
                actualizarStorage();
                renderizar();
            }
        }

        function copiarLista(jIdx) {
            let juego = datos[jIdx];
            let ahora = new Date();
            let fecha = ahora.toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            let hora = ahora.toLocaleTimeString('es-VE', { hour: 'numeric', minute: '2-digit' });
            let texto = `🧙‍♂️${juego.nombre}\n_____________________________\n`;
            juego.productos.filter(p => !p.esOtro).forEach(p => {
                texto += `- ${p.prod} / ${(parseFloat(p.precio) * tasa).toLocaleString('es-VE', {minimumFractionDigits: 2})} Bs.\n`;
            });
            let otros = juego.productos.filter(p => p.esOtro);
            if(otros.length > 0) {
                texto += `\nOtros Productos:\n`;
                otros.forEach(p => { texto += `- ${p.prod} / ${(parseFloat(p.precio) * tasa).toLocaleString('es-VE', {minimumFractionDigits: 2})} Bs.\n`; });
            }
            texto += `_____________________________\n⏰${fecha}\n${hora}\n\n${firma}`;
            navigator.clipboard.writeText(texto);
            alert("¡Lista copiada!");
        }

        function agregarJuego() { let nombre = document.getElementById('nuevoJuego').value; if(nombre) { datos.push({nombre, productos: []}); actualizarStorage(); renderizar(); } }
        function agregarProducto(jIdx, esOtro=false) { let prod = prompt("Nombre:"); let precio = prompt("Precio USD:"); if(prod && precio) { datos[jIdx].productos.push({prod, precio, esOtro}); actualizarStorage(); renderizar(); } }
        function editarProducto(jIdx, pIdx) { let p = datos[jIdx].productos[pIdx]; let nP = prompt("Nombre:", p.prod); let nPr = prompt("Precio:", p.precio); if(nP && nPr) { datos[jIdx].productos[pIdx] = {prod: nP, precio: nPr, esOtro: p.esOtro}; actualizarStorage(); renderizar(); } }
        function actualizarStorage() { localStorage.setItem('magoStore', JSON.stringify(datos)); }
        renderizar();
    </script>
</body>
</html>
